name: MLOps Pipeline

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: false
        type: boolean
        default: true

      run_data_processing:
        description: 'Run data processing job'
        required: false
        type: boolean
        default: false

      run_model_training:
        description: 'Run model training job'
        required: false
        type: boolean
        default: false

      run_build_and_publish:
        description: 'Run build and publish job'
        required: false
        type: boolean
        default: false

  release:
    types: [created]
    branches: [main]
    tags: ['v*.*.*']

jobs:
  data_processing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data processing
        run: |
          python src/data/run_processing.py   \
          --input data/raw/house_data.csv   \
          --output data/processed/cleaned_house_data.csv

      - name: Run feature engineering
        run: |
          python src/features/engineer.py   \
          --input data/processed/cleaned_house_data.csv   \
          --output data/processed/featured_house_data.csv   \
          --preprocessor models/trained/preprocessor.pkl

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/featured_house_data.csv

      - name: Upload preprocessor
        uses: actions/upload-artifact@v4
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl

  model_training:
    runs-on: ubuntu-latest
    needs: data_processing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v3
        with:
          name: processed-data
          path: data/processed/featured_house_data.csv

      - name: Download preprocessor
        uses: actions/download-artifact@v3
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl

      - name: Start MLflow server
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5555:5000 --name mlflow-server ghcr.io/mlflow/mlflow:latest \
            mlflow server --host 0.0.0 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root /tmp/mlruns

      - name: Run model training
        run: |
          python src/models/train_model.py   \
          --config configs/model_config.yaml   \
          --data data/processed/featured_house_data.csv   \
          --models-dir models   --mlflow-tracking-uri http://localhost:5555

      - name: Clean up MLflow server
        run: |
          docker stop mlflow-server
          docker rm mlflow-server

  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/house-price-fastapi:${{ github.sha }}
          context: "."
          file: "Dockerfile"