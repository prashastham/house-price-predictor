services:

  fastapi:
    image: "prashastham/house-price-fastapi:dev"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
  streamlit:
    image: "prashastham/house-price-streamlit:dev"
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://fastapi:8000"

  